<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA — iPhone 16 Pro · 30s Spot</title>
<style>
  /* ---------------------------------------------------------------
     Cinematic stage: pure black, no scrollbars, canvas fills view.
     --------------------------------------------------------------- */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "SF Pro Display", "SF Pro Text", -apple-system,
                 BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  canvas { display: block; }

  /* Soft lens vignette over the 3D render */
  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }

  /* Tagline — fades in at 27s, centered below the phone */
  #tagline {
    position: fixed;
    left: 0; right: 0;
    bottom: 9vh;
    text-align: center;
    color: #fff;
    font-weight: 600;
    font-size: clamp(22px, 3.2vw, 44px);
    letter-spacing: 0.015em;
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
    text-shadow: 0 0 30px rgba(140, 180, 255, 0.35);
  }
  #tagline small {
    display: block;
    margin-top: 0.9em;
    font-size: 0.38em;
    font-weight: 400;
    letter-spacing: 0.32em;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }

  /* Full-frame fade used for the opening fade-in and the loop reset */
  #fade {
    position: fixed; inset: 0;
    background: #000;
    opacity: 1;
    pointer-events: none;
  }

  /* Play/pause toggle — tucked in the bottom-right corner, never center */
  #playpause {
    position: fixed;
    right: 20px; bottom: 20px;
    width: 54px; height: 54px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(12,16,24,0.6);
    border: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    color: #fff; font-size: 20px;
    cursor: pointer; z-index: 15;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  #playpause:hover { opacity: 1; }

  /* Uploaded brand logo — fades in with the tagline */
  #logo {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(9vh + 120px);
    max-height: 72px; max-width: 40vw;
    opacity: 0;
    display: none;
    pointer-events: none;
    filter: drop-shadow(0 0 24px rgba(140,180,255,0.35));
  }

  /* Upload controls — quiet pills, top-left */
  #controls {
    position: fixed;
    top: 16px; left: 16px;
    display: flex; gap: 8px;
    z-index: 10;
  }
  #controls input[type=text] { width: 150px; cursor: text; }
  #controls button, #controls select, #controls input[type=text] {
    font: 500 12px/1 "SF Pro Text", -apple-system, "Inter", "Segoe UI", sans-serif;
    color: rgba(255,255,255,0.8);
    background: rgba(20,24,34,0.6);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    opacity: 0.45;
    backdrop-filter: blur(8px);
    transition: opacity 0.2s;
  }
  #controls button:hover, #controls select:hover,
  #controls input[type=text]:hover, #controls input[type=text]:focus { opacity: 1; }
  #controls select option { background: #14181f; color: #eef2fa; }
</style>

<!-- Three.js from CDN — the only external dependency -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="vignette"></div>
<div id="tagline">The future, in your hands.<small>iPhone 16 Pro</small></div>
<img id="logo" alt="">
<div id="playpause" title="Play / pause (Spacebar)">&#9654;</div>
<div id="fade"></div>
<div id="controls">
  <select id="phoneSel" title="Phone model">
    <option value="iphone-16-pro">iPhone 16 Pro</option>
    <option value="iphone-16-pro-max">iPhone 16 Pro Max</option>
    <option value="iphone-15-pro">iPhone 15 Pro</option>
    <option value="iphone-14-pro">iPhone 14 Pro</option>
    <option value="iphone-14-pro-max">iPhone 14 Pro Max</option>
    <option value="iphone-13">iPhone 13</option>
  </select>
  <button id="shotBtn" title="Shown on the phone screen; the scene recolors to match">&#8679; App screenshot</button>
  <button id="logoBtn" title="Appears with the tagline">&#8679; Logo</button>
  <input type="text" id="titleInput" placeholder="Custom tagline&#8230;" maxlength="60">
  <input type="text" id="urlInput" placeholder="Live URL &#8212; localhost:3000 &#x23CE;" title="Press Enter: the phone screen becomes a real, interactive browser view. Clear + Enter to exit.">
  <button id="interactBtn" hidden>Interact</button>
  <button id="proxyBtn" hidden title="If a site refuses to be embedded (blank screen), route it through the local proxy">Proxy: off</button>
  <button id="freezeBtn" hidden title="Freeze the live page onto the phone screen as an image — then Save PNG / Record work">&#128247; Capture live</button>
  <button id="snapBtn" title="Saves the current frame as a PNG (controls are never captured)">Save PNG</button>
  <button id="recBtn" title="Record the ad as a video file (controls are never captured)">&#9679; Record</button>
  <input type="file" id="shotInput" accept="image/png,image/jpeg,image/webp" hidden>
  <input type="file" id="logoInput" accept="image/png,image/svg+xml,image/webp" hidden>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment }  from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass }        from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

/* =====================================================================
   TIMELINE CONSTANTS — the whole spot is driven by adT in [0, 30)
   0–5    fade in, phone rises from below with a subtle rotation
   5–15   slow camera orbit, screen UI animates
   15–25  phone tilts to side profile, light sweeps the titanium edge
   25–30  phone re-centers, screen glows, tagline fades in at 27s
   ===================================================================== */
const DURATION = 30;

/* ------------------------- small math helpers ------------------------ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
// smoothstep keyed to an absolute time window [t0, t1]
const sm = (t0, t1, t) => {
  const x = clamp((t - t0) / (t1 - t0), 0, 1);
  return x * x * (3 - 2 * x);
};
// Unit step response of an under-damped spring — used for motion that should
// feel like it has mass: a fast approach, a slight overshoot, a soft settle.
function springStep(x, omega = 6.0, zeta = 0.72) {
  if (x <= 0) return 0;
  const wd = omega * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * omega * x) * (Math.cos(wd * x) + (zeta * omega / wd) * Math.sin(wd * x));
}

/* --------------------------- renderer setup -------------------------- */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (err) {
  // a crashed GPU process otherwise yields a silent black page
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:grid;place-items:center;z-index:50;' +
    'color:#9fb4d8;font:500 16px -apple-system,&quot;Segoe UI&quot;,sans-serif;text-align:center">' +
    'WebGL is unavailable &mdash; the browser\'s GPU process has likely crashed.<br>' +
    'Close and reopen the browser, then reload this page.</div>');
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
Object.assign(renderer.domElement.style, { position: 'fixed', inset: '0', zIndex: '1' });
document.body.insertBefore(renderer.domElement, document.getElementById('vignette'));

// CSS3D layer BEHIND the WebGL canvas — live URL mode punches a hole in
// the canvas where the phone screen is, revealing an interactive iframe
const cssScene = new THREE.Scene();
const cssRenderer = new CSS3DRenderer();
cssRenderer.setSize(window.innerWidth, window.innerHeight);
Object.assign(cssRenderer.domElement.style, { position: 'fixed', inset: '0', zIndex: '0' });
document.body.insertBefore(cssRenderer.domElement, renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020307);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 60);
const camTarget = new THREE.Vector3(0, 0.02, 0);

// Neutral studio environment gives the metal/glass real reflections
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

/* ------------------------------ lighting ------------------------------
   One dramatic cool-blue key, a faint warm rim for edge separation,
   and a white "sweep" light that travels across the frame at 16–23s. */
const keyLight = new THREE.DirectionalLight(0xbfd8ff, 3.2);
keyLight.position.set(2.6, 3.2, 2.2);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xffd9a8, 0.7);
rimLight.position.set(-3.0, 1.2, -2.6);
scene.add(rimLight);

const sweepLight = new THREE.DirectionalLight(0xffffff, 0);
sweepLight.position.set(-3, 1.4, 2.5);
scene.add(sweepLight);

scene.add(new THREE.AmbientLight(0x223044, 0.35));

/* =====================================================================
   PHONE — built procedurally from a model spec
   Body: extruded rounded rectangle with a bevel (the metal frame).
   Front: black bezel + emissive screen (live canvas texture).
   Back: matte glass slab, camera plateau with lenses.
   ===================================================================== */
const BODY_DEPTH = 0.060, BEVEL = 0.009;
const HALF_Z = BODY_DEPTH / 2 + BEVEL;          // half of total thickness

// Selectable models. w/h/r are world-unit width, height, corner radius
// (real handset dimensions ÷ 100); island=false gets the classic notch.
const PHONE_SPECS = {
  'iphone-16-pro':     { label: 'IPHONE 16 PRO',     w: 0.720, h: 1.500, r: 0.105, island: true,  cams: 3 },
  'iphone-16-pro-max': { label: 'IPHONE 16 PRO MAX', w: 0.780, h: 1.632, r: 0.110, island: true,  cams: 3 },
  'iphone-15-pro':     { label: 'IPHONE 15 PRO',     w: 0.715, h: 1.495, r: 0.100, island: true,  cams: 3 },
  'iphone-14-pro':     { label: 'IPHONE 14 PRO',     w: 0.715, h: 1.475, r: 0.092, island: true,  cams: 3 },
  'iphone-14-pro-max': { label: 'IPHONE 14 PRO MAX', w: 0.780, h: 1.607, r: 0.096, island: true,  cams: 3 },
  'iphone-13':         { label: 'IPHONE 13',         w: 0.717, h: 1.465, r: 0.090, island: false, cams: 2 }
};
let phoneSpec = PHONE_SPECS['iphone-16-pro'];

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x + w, y + h - r);
  s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
  s.lineTo(x + r, y + h);
  s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x, y + r);
  s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}

const titanium = new THREE.MeshPhysicalMaterial({
  color: 0x8d9095, metalness: 1.0, roughness: 0.34,
  envMapIntensity: 1.1, clearcoat: 0.4, clearcoatRoughness: 0.35
});
const darkGlass = new THREE.MeshPhysicalMaterial({
  color: 0x16181d, metalness: 0.55, roughness: 0.32,
  envMapIntensity: 0.8, clearcoat: 0.8, clearcoatRoughness: 0.2
});
const lensGlass = new THREE.MeshPhysicalMaterial({
  color: 0x05070c, metalness: 0.0, roughness: 0.05,
  envMapIntensity: 1.4, clearcoat: 1.0, clearcoatRoughness: 0.05
});
// writes alpha-0 pixels (NoBlending) — punches a see-through hole in the
// canvas for live URL mode; shaped exactly like the screen's rounded rect
const punchMat = new THREE.MeshBasicMaterial({
  color: 0x000000, opacity: 0, blending: THREE.NoBlending
});

// --- screen canvas: one live 2D canvas shared by every phone model.
//     Rounded corners are masked in the canvas itself (transparent corners
//     reveal the black bezel behind). toneMapped:false keeps it punchy. ---
const ui = document.createElement('canvas');
ui.width = 720; ui.height = 1576;
const uictx = ui.getContext('2d');
let shotImg = null;   // user-uploaded app screenshot; replaces the demo UI
// edge colors sampled from the screenshot — the top/bottom spacers take
// these on so the island/home areas blend into the app's own chrome
let shotTop = 'rgb(7,11,22)', shotBot = 'rgb(7,11,22)';
let shotTopLum = 0, shotBotLum = 0;
const screenTex = new THREE.CanvasTexture(ui);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.anisotropy = 8;
const screenMat = new THREE.MeshBasicMaterial({ map: screenTex, transparent: true, toneMapped: false });

function buildPhone(spec) {
  const grp = new THREE.Group();
  const W = spec.w, H = spec.h, R = spec.r;

  // titanium frame / body
  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(W, H, R), {
    depth: BODY_DEPTH, bevelEnabled: true,
    bevelThickness: BEVEL, bevelSize: BEVEL, bevelSegments: 5, curveSegments: 48
  });
  bodyGeo.translate(0, 0, -BODY_DEPTH / 2);      // center on z = 0
  grp.add(new THREE.Mesh(bodyGeo, titanium));

  // back glass (slightly inset matte slab)
  const back = new THREE.Mesh(
    new THREE.ShapeGeometry(roundedRectShape(W - 0.02, H - 0.02, R - 0.01), 48), darkGlass);
  back.rotation.y = Math.PI;                     // face -z
  back.position.z = -(HALF_Z + 0.0006);
  grp.add(back);

  // front bezel (black border the screen sits inside)
  const bezel = new THREE.Mesh(
    new THREE.ShapeGeometry(roundedRectShape(W - 0.022, H - 0.022, R - 0.012), 48),
    new THREE.MeshBasicMaterial({ color: 0x000000 }));
  bezel.position.z = HALF_Z + 0.0006;
  grp.add(bezel);

  // screen plane
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.065, H - 0.065), screenMat);
  screen.position.z = HALF_Z + 0.0012;
  grp.add(screen);
  grp.userData.screen = screen;   // hidden during live-URL mode

  // rounded-rect punch hole, congruent with the live iframe's corners —
  // a plain rectangle would let dark notches peek past the rounding
  const punch = new THREE.Mesh(
    new THREE.ShapeGeometry(roundedRectShape(W - 0.065, H - 0.065, R - 0.013), 48), punchMat);
  punch.position.z = HALF_Z + 0.0012;
  punch.visible = false;
  grp.add(punch);
  grp.userData.punch = punch;

  // camera plateau + lenses, back top-left
  {
    const bump = new THREE.Group();
    bump.position.set(-(W / 2 - 0.195), H / 2 - 0.275, -HALF_Z);
    bump.rotation.y = Math.PI;                   // extrude toward -z

    const plate = spec.cams === 3 ? 0.30 : 0.26;
    bump.add(new THREE.Mesh(new THREE.ExtrudeGeometry(roundedRectShape(plate, plate + 0.01, 0.085), {
      depth: 0.012, bevelEnabled: true,
      bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 3, curveSegments: 32
    }), titanium));

    // ring + glass + inner pupil for each lens
    const lensAt = (x, y) => {
      const g = new THREE.Group();
      g.position.set(x, y, 0.020);
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.012, 40), titanium);
      ring.rotation.x = Math.PI / 2;
      const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.044, 0.013, 40), lensGlass);
      glass.rotation.x = Math.PI / 2;
      const pupil = new THREE.Mesh(
        new THREE.CircleGeometry(0.020, 32),
        new THREE.MeshBasicMaterial({ color: 0x10203c })
      );
      pupil.position.z = 0.0075;
      g.add(ring, glass, pupil);
      return g;
    };
    const flash = new THREE.Mesh(
      new THREE.CircleGeometry(0.018, 24),
      new THREE.MeshBasicMaterial({ color: 0xfff3d6 })
    );
    if (spec.cams === 3) {                       // Pro: triangle + flash
      bump.add(lensAt(-0.072,  0.072));
      bump.add(lensAt(-0.072, -0.072));
      bump.add(lensAt( 0.072,  0.0));
      flash.position.set(0.072, 0.105, 0.021);
    } else {                                     // non-Pro: diagonal pair
      bump.add(lensAt(-0.058,  0.058));
      bump.add(lensAt( 0.058, -0.058));
      flash.position.set(0.062, 0.062, 0.021);
    }
    bump.add(flash);
    grp.add(bump);
  }

  // side buttons (power right; action + volumes left)
  {
    const btn = (x, y, h) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.014, h, 0.030), titanium);
      m.position.set(x, y, 0);
      grp.add(m);
    };
    btn( W / 2 + 0.002, 0.18, 0.190);   // power
    btn(-W / 2 - 0.002, 0.46, 0.075);   // action
    btn(-W / 2 - 0.002, 0.27, 0.105);   // vol up
    btn(-W / 2 - 0.002, 0.13, 0.105);   // vol down
  }
  return grp;
}

let phone = buildPhone(phoneSpec);
scene.add(phone);

function setPhoneModel(key) {
  if (!PHONE_SPECS[key]) return;
  phoneSpec = PHONE_SPECS[key];
  scene.remove(phone);
  phone.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  phone = buildPhone(phoneSpec);
  scene.add(phone);
  document.querySelector('#tagline small').textContent = phoneSpec.label;
  // live URL mode targets the new screen mesh and re-sizes its iframe
  if (typeof urlMode !== 'undefined' && urlMode) setLiveURL(liveURL);
}

/* =====================================================================
   BACKGROUND ATMOSPHERE — drifting particles + faint light streaks
   ===================================================================== */
const dust = (() => {
  const N = 600;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = (Math.random() - 0.5) * 14;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 9;
    pos[i * 3 + 2] = -1.5 - Math.random() * 9;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0x6f9fdf, size: 0.022, sizeAttenuation: true,
    transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
})();

function streakTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 32;
  const g = c.getContext('2d');
  const lin = g.createLinearGradient(0, 0, 256, 0);
  lin.addColorStop(0,   'rgba(130,175,255,0)');
  lin.addColorStop(0.5, 'rgba(175,205,255,1)');
  lin.addColorStop(1,   'rgba(130,175,255,0)');
  g.fillStyle = lin; g.fillRect(0, 0, 256, 32);
  g.globalCompositeOperation = 'destination-in';
  const ver = g.createLinearGradient(0, 0, 0, 32);
  ver.addColorStop(0, 'rgba(0,0,0,0)');
  ver.addColorStop(0.5, 'rgba(0,0,0,1)');
  ver.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = ver; g.fillRect(0, 0, 256, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const streaks = [];
{
  const tex = streakTexture();
  for (let i = 0; i < 7; i++) {
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(5 + Math.random() * 4, 0.05 + Math.random() * 0.05), mat);
    m.position.set((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 5, -2.5 - Math.random() * 6);
    m.rotation.z = (Math.random() - 0.5) * 0.5;
    m.userData = { speed: 0.10 + Math.random() * 0.22, base: 0.16 + Math.random() * 0.20, ph: Math.random() * 6.28 };
    scene.add(m);
    streaks.push(m);
  }
}

/* ---- soft color pools behind the phone — these carry the dynamic
        theme: when a screenshot is uploaded they take its palette ---- */
function softGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const rad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rad.addColorStop(0, 'rgba(255,255,255,0.8)');
  rad.addColorStop(0.4, 'rgba(255,255,255,0.25)');
  rad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rad; g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = softGlowTexture();
function bgGlow(color, size, x, y, z, opacity) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({
      map: glowTex, color, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
const glowA = bgGlow(0x4d9fff, 9.5, -2.2,  1.2, -4.5, 0.14);
const glowB = bgGlow(0x36e2c0, 8.0,  2.4, -1.4, -5.0, 0.10);

/* =====================================================================
   POST-PROCESSING — depth of field (bokeh) + bloom
   ===================================================================== */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 3.2, aperture: 0.00012, maxblur: 0.0075 });
composer.addPass(bokeh);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.65, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =====================================================================
   SCREEN UI — "AURA", a live personal-energy dashboard, drawn in 2D
   every frame and uploaded as the screen texture.
   ===================================================================== */
function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
const SANS = '-apple-system, "SF Pro Display", "Inter", "Segoe UI", sans-serif';

// Dynamic Island (Pro models) or classic notch (e.g. iPhone 13),
// drawn over whatever is on screen so it always looks native
function drawCutout(g, W, T) {
  g.fillStyle = '#000';
  if (phoneSpec.island) {
    roundRectPath(g, (W - 226) / 2, 26, 226, 66, 33); g.fill();
    g.fillStyle = 'rgba(40,46,66,0.9)';
    g.beginPath(); g.arc(W / 2 + 42, 59, 10, 0, 7); g.fill();
    g.fillStyle = `rgba(80,230,180,${0.55 + 0.45 * Math.sin(T * 3)})`;
    g.beginPath(); g.arc(W / 2 + 80, 59, 8, 0, 7); g.fill();
  } else {
    roundRectPath(g, (W - 320) / 2, -34, 320, 86, 26); g.fill();
    g.fillStyle = 'rgba(40,46,66,0.9)';
    g.beginPath(); g.arc(W / 2 + 84, 30, 9, 0, 7); g.fill();
  }
}

function drawUI(t, T) {
  const g = uictx, W = ui.width, H = ui.height;
  g.clearRect(0, 0, W, H);

  // clip everything to the rounded screen shape (corners stay transparent)
  g.save();
  roundRectPath(g, 0, 0, W, H, 84);
  g.clip();
  g.textAlign = 'left';

  /* ---- uploaded screenshot mode: the image IS the screen ----
     Top/bottom spacers take the screenshot's own edge colors, so the
     Dynamic Island and home indicator live in matching bands instead of
     covering the app's header or nav. ---- */
  if (shotImg) {
    const padT = 110, padB = 70;
    g.fillStyle = shotTop; g.fillRect(0, 0, W, padT);
    g.fillStyle = shotBot; g.fillRect(0, H - padB, W, padB);
    // cover-fit the screenshot between the spacers
    const ah = H - padT - padB;
    const s = Math.max(W / shotImg.width, ah / shotImg.height);
    const dw = shotImg.width * s, dh = shotImg.height * s;
    g.save();
    g.beginPath(); g.rect(0, padT, W, ah); g.clip();
    g.drawImage(shotImg, (W - dw) / 2, padT + (ah - dh) / 2, dw, dh);
    g.restore();
    // status clock + battery in the top spacer, contrast-aware
    const inkT = shotTopLum > 0.5 ? 'rgba(18,22,30,0.88)' : 'rgba(255,255,255,0.92)';
    g.fillStyle = inkT;

    roundRectPath(g, W - 127, 41, 46, 24, 6); g.fillStyle = inkT; g.fill();

    const ig = sm(25.5, 27.6, t);

  let blob = g.createRadialGradient(W * 0.78, 340, 40, W * 0.78, 340, 540);

  const av = g.createLinearGradient(W - 140, 156, W - 60, 236);
  av.addColorStop(0, '#4d9fff'); av.addColorStop(1, '#36e2c0');

      area.addColorStop(0, 'rgba(77,159,255,0.30)');
      area.addColorStop(1, 'rgba(77,159,255,0)');
      g.fillStyle = area;
      g.beginPath();
      g.moveTo(cx0, cbot);
      for (let x = cx0; x <= cx1; x += 5) g.lineTo(x, wave((x - cx0) / (cx1 - cx0)));
      g.lineTo(cx1, cbot); g.closePath(); g.fill();
      // the line itself
      const grad = g.createLinearGradient(cx0, 0, cx1, 0);
      grad.addColorStop(0, '#59b8ff'); grad.addColorStop(1, '#43e9c8');
      g.strokeStyle = grad; g.lineWidth = 5; g.lineJoin = 'round';
      g.shadowColor = '#4fc4ff'; g.shadowBlur = 16;
      g.beginPath();
      for (let x = cx0; x <= cx1; x += 5) {
        const y = wave((x - cx0) / (cx1 - cx0));
        x === cx0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
      g.shadowBlur = 0;
      g.restore();
      // pulsing dot at the leading edge of the reveal
      const lx = cx0 + (cx1 - cx0) * reveal;
      const ly = wave(reveal);
      g.fillStyle = `rgba(110,225,200,${0.25 + 0.2 * Math.sin(T * 5)})`;
      g.beginPath(); g.arc(lx, ly, 16 + 4 * Math.sin(T * 5), 0, 7); g.fill();
      g.fillStyle = '#43e9c8';
      g.beginPath(); g.arc(lx, ly, 8, 0, 7); g.fill();

    label('9 AM', cx0, 1060, 'rgba(200,214,240,0.35)', 18, '2px');
    label('1 PM', 290, 1060, 'rgba(200,214,240,0.35)', 18, '2px');

    label('RECOVERY', 84, 1178);

    g.shadowBlur = 0;

    g.fillText(`${Math.round(92 * fill)}%`, 212, 1298);

    // streak: count + cascading heatmap dots
    card(375, 1118, 305, 250, 40);
    label('STREAK', 419, 1178);
    g.fillStyle = '#ffffff';
    g.font = `700 52px ${SANS}`;
    g.fillText('21', 419, 1246);
    g.fillStyle = 'rgba(200,214,240,0.5)';

    g.fillText('days', 492, 1246);
    for (let i = 0; i < 21; i++) {
      const col = i % 7, row = (i / 7) | 0;
      const x = 419 + col * 34, y = 1288 + row * 32;
      const d = fill * 23 - i;                 // each dot lights with a stagger
      const lit = clamp(d, 0, 1);
      const pop = 1 + 0.6 * clamp(1 - Math.abs(d - 1), 0, 1) * (d < 2 ? 1 : 0);
      g.fillStyle = lit > 0
        ? hexA('#4d9fff', 0.35 + 0.65 * lit * (0.5 + 0.5 * i / 21))
        : 'rgba(255,255,255,0.08)';

  }

  /* ---- floating glass tab bar ---- */
  {
    const a = sm(8, 9.6, t);
    g.save();
    g.globalAlpha = boot * a;
    g.translate(0, (1 - a) * 30);
    card(40, 1398, W - 80, 96, 48);
    const cy = 1446, xs = [136, 286, 436, 586];
    g.fillStyle = 'rgba(77,159,255,0.16)';
    g.beginPath(); g.arc(xs[0], cy, 34, 0, 7); g.fill();

    g.beginPath();
    g.moveTo(xs[0] - 16, cy + 12); g.lineTo(xs[0] - 16, cy - 2);
    g.lineTo(xs[0], cy - 14); g.lineTo(xs[0] + 16, cy - 2); g.lineTo(xs[0] + 16, cy + 12);
    g.closePath(); g.stroke();
    const dim = 'rgba(214,226,248,0.38)';
    // rings
    g.strokeStyle = dim;
    g.beginPath(); g.arc(xs[1], cy, 14, 0, 7); g.stroke();
    g.beginPath(); g.arc(xs[1], cy, 7, 0, 7); g.stroke();
    // bars
    g.fillStyle = dim;
    roundRectPath(g, xs[2] - 16, cy - 2, 8, 16, 3); g.fill();
    roundRectPath(g, xs[2] - 4, cy - 10, 8, 24, 3); g.fill();
    roundRectPath(g, xs[2] + 8, cy - 6, 8, 20, 3); g.fill();
    // person
    g.strokeStyle = dim;
    g.beginPath(); g.arc(xs[3], cy - 7, 8, 0, 7); g.stroke();
    g.beginPath(); g.arc(xs[3], cy + 16, 13, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
    g.restore();
  }

  /* ---- home indicator ---- */
  g.fillStyle = 'rgba(255,255,255,0.45)';
  roundRectPath(g, (W - 200) / 2, H - 36, 200, 8, 4); g.fill();

  g.restore(); // boot alpha

  /* ---- score-land flash: a quick white kiss over the whole screen ---- */
  if (hit > 0.01) {
    g.fillStyle = `rgba(190,220,255,${0.18 * hit})`;
    g.fillRect(0, 0, W, H);
  }

  /* ---- finale: the whole screen blooms white-blue (25–30s) ---- */
  const glow = sm(25.5, 27.6, t);
  if (glow > 0) {
    g.fillStyle = `rgba(170,205,255,${0.12 * glow})`;
    g.fillRect(0, 0, W, H);
    const rad = g.createRadialGradient(W / 2, H * 0.42, 30, W / 2, H * 0.42, H * 0.7);
    rad.addColorStop(0, `rgba(255,255,255,${0.32 * glow})`);
    rad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rad; g.fillRect(0, 0, W, H);
  }

  g.restore(); // screen clip
  screenTex.needsUpdate = true;
}

/* =====================================================================
   CAMERA + CHOREOGRAPHY
   Azimuth/elevation/distance are piecewise-smooth keyframe sums so each
   phase hands off seamlessly to the next.
   ===================================================================== */
/* =====================================================================
   UPLOADS + DYNAMIC THEME
   A screenshot upload goes onto the phone screen, and its dominant
   colors re-light the whole scene: background pools, particles, light
   streaks, key/rim lights. A logo upload joins the tagline finale.
   ===================================================================== */
function extractPalette(img) {
  // downsample, then build a hue histogram weighted by saturation×value
  // so vibrant brand colors win over big gray/white areas
  const c = document.createElement('canvas');
  c.width = c.height = 48;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, 48, 48);
  const d = x.getImageData(0, 0, 48, 48).data;
  const buckets = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gg = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    const v = mx / 255, s = mx ? (mx - mn) / mx : 0;
    const w = s * s * v + 0.001;
    let h = 0;
    if (mx !== mn) {
      if (mx === r) h = ((gg - b) / (mx - mn) + 6) % 6;
      else if (mx === gg) h = (b - r) / (mx - mn) + 2;
      else h = (r - gg) / (mx - mn) + 4;
    }
    const k = Math.floor(h * 2) % 12;          // 12 hue buckets
    buckets[k].w += w;
    buckets[k].r += r * w; buckets[k].g += gg * w; buckets[k].b += b * w;
  }
  // average luminance — used to dim bright (light-mode) screenshots so
  // they read as a real display instead of blowing out the bloom pass
  let lumSum = 0;
  for (let i = 0; i < d.length; i += 4) lumSum += d[i] + d[i + 1] + d[i + 2];
  const lum = lumSum / (d.length / 4) / 765;
  const sorted = buckets.filter(bk => bk.w > 0.01).sort((a, b) => b.w - a.w);
  const toCol = bk => new THREE.Color(bk.r / bk.w / 255, bk.g / bk.w / 255, bk.b / bk.w / 255);
  const p1 = sorted[0] ? toCol(sorted[0]) : new THREE.Color(0x4d9fff);
  const p2 = sorted[1] ? toCol(sorted[1]) : p1.clone().offsetHSL(0.12, 0, 0.04);
  // lift toward glow range so even dark screenshots light the scene
  const hsl = {};
  for (const col of [p1, p2]) {
    col.getHSL(hsl);
    col.setHSL(hsl.h, clamp(hsl.s * 1.3 + 0.12, 0, 1), clamp(hsl.l * 1.25, 0.42, 0.62));
  }
  // edge bands (top/bottom 3 rows) → spacer colors
  let tr = 0, tg = 0, tb = 0, br = 0, bg = 0, bb = 0;
  const n = 48 * 3;
  for (let y = 0; y < 3; y++) for (let x = 0; x < 48; x++) {
    const i = (y * 48 + x) * 4, j = ((45 + y) * 48 + x) * 4;
    tr += d[i]; tg += d[i + 1]; tb += d[i + 2];
    br += d[j]; bg += d[j + 1]; bb += d[j + 2];
  }
  const top = { r: tr / n, g: tg / n, b: tb / n };
  const bot = { r: br / n, g: bg / n, b: bb / n };
  return { p1, p2, lum, top, bot };
}

function applyPalette(p1, p2) {
  glowA.material.color.copy(p1);
  glowB.material.color.copy(p2);
  dust.material.color.copy(p1.clone().lerp(new THREE.Color(0xffffff), 0.25));
  keyLight.color.copy(p1.clone().lerp(new THREE.Color(0xffffff), 0.65));
  rimLight.color.copy(p2.clone().lerp(new THREE.Color(0xffffff), 0.35));
  for (const s of streaks) s.material.color.copy(p1.clone().lerp(new THREE.Color(0xffffff), 0.3));
  scene.background = p1.clone().multiplyScalar(0.035);
}

const logoEl = document.getElementById('logo');
function applyShotImage(img) {
  shotImg = img;
  const { p1, p2, lum, top, bot } = extractPalette(img);
  applyPalette(p1, p2);
  // bright screenshots get dimmed harder so whites stay below bloom
  screenMat.color.setScalar(lum > 0.55 ? 0.62 : lum > 0.35 ? 0.76 : 0.92);
  // spacer colors + their luminance (for contrast-aware clock/indicator)
  shotTop = `rgb(${top.r | 0},${top.g | 0},${top.b | 0})`;
  shotBot = `rgb(${bot.r | 0},${bot.g | 0},${bot.b | 0})`;
  shotTopLum = (top.r + top.g + top.b) / 765;
  shotBotLum = (bot.r + bot.g + bot.b) / 765;
}
function loadShot(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);

  img.onload = () => { applyShotImage(img); URL.revokeObjectURL(url); };
  img.src = url;
}
function loadLogo(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { logoEl.src = rd.result; logoEl.style.display = 'block'; };
  rd.readAsDataURL(file);
}

/* =====================================================================
   LIVE URL MODE — the phone screen becomes a real browser view.
   A CSS3D iframe sits behind the WebGL canvas, matched exactly to the
   screen plane; a "punch" material writes alpha-0 pixels where the
   screen is, so the iframe shows through the hole. Post-processing is
   bypassed in this mode (bloom would paint over the hole).
   "Interact" disables canvas pointer events so clicks reach the iframe.
   ===================================================================== */
const IFRAME_W = 390;                       // CSS px; height follows the model
let urlMode = false, liveURL = '', cssObj = null, interacting = false;
let proxyOn = false, proxyTouched = false;   // auto until the user overrides
const urlInput = document.getElementById('urlInput');
const interactBtn = document.getElementById('interactBtn');
const proxyBtn = document.getElementById('proxyBtn');
const freezeBtn = document.getElementById('freezeBtn');

function setLiveURL(url) {
  if (cssObj) {
    cssScene.remove(cssObj);
    cssObj.element.remove();
    cssObj = null;
  }
  liveURL = url || '';
  urlMode = !!liveURL;
  phone.userData.screen.visible = !urlMode;
  phone.userData.punch.visible = urlMode;
  interactBtn.hidden = !urlMode;
  proxyBtn.hidden = !urlMode;
  freezeBtn.hidden = !urlMode;
  if (!urlMode) {
    interacting = false;
    cv.style.pointerEvents = 'auto';
    interactBtn.textContent = 'Interact';
    return;
  }
  const hpx = Math.round(IFRAME_W * (phoneSpec.h - 0.065) / (phoneSpec.w - 0.065));
  // iframe corner radius in CSS px = the punch hole's world radius / scale,
  // so DOM rounding and the canvas hole are congruent on every model
  const brPx = Math.round((phoneSpec.r - 0.013) / ((phoneSpec.w - 0.065) / IFRAME_W));
  // TRUE SAFE AREAS: web apps don't reserve room for the island the way
  // native apps do, so the page gets a black status band (the island
  // lives there, black-on-black like real hardware) and a black home
  // band. The app sits between them — nothing ever covers its content,
  // and all rounding stays on the hardware bezel where it belongs.
  const SAFE_T = 54, SAFE_B = 24;
  const wrap = document.createElement('div');
  Object.assign(wrap.style, {
    position: 'relative', width: IFRAME_W + 'px', height: hpx + 'px',
    borderRadius: brPx + 'px', overflow: 'hidden', background: '#000'
  });
  // public sites almost always block iframing (X-Frame-Options /
  // frame-ancestors), so the proxy defaults ON for them and OFF for
  // local dev servers — until the user toggles it manually
  if (!proxyTouched) {
    proxyOn = !/^https?:\/\/(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.)/i.test(liveURL);
    proxyBtn.textContent = `Proxy: ${proxyOn ? 'on' : 'off'}`;
  }
  const ifr = document.createElement('iframe');
  // proxy mode tunnels through serve.py, which strips the headers sites
  // use to refuse embedding
  ifr.src = proxyOn ? '/proxy?u=' + encodeURIComponent(liveURL) : liveURL;
  Object.assign(ifr.style, {
    position: 'absolute', left: '0', top: SAFE_T + 'px',
    width: '100%', height: (hpx - SAFE_T - SAFE_B) + 'px', border: '0',
    background: '#fff'
  });
  wrap.appendChild(ifr);
  // status bar furniture in the top band
  const clock = document.createElement('div');
  clock.textContent = '9:41';
  Object.assign(clock.style, {
    position: 'absolute', left: '30px', top: '17px',
    font: '600 15px -apple-system, "SF Pro Text", "Segoe UI", sans-serif',
    color: '#fff', letterSpacing: '0.02em'
  });
  wrap.appendChild(clock);
  const batt = document.createElement('div');
  Object.assign(batt.style, {
    position: 'absolute', right: '26px', top: '20px', width: '22px', height: '11px',
    border: '1.5px solid rgba(255,255,255,0.6)', borderRadius: '4px'
  });
  const battFill = document.createElement('div');
  Object.assign(battFill.style, {
    position: 'absolute', left: '1.5px', top: '1.5px', width: '14px', height: '6px',
    borderRadius: '2px', background: '#fff'
  });
  batt.appendChild(battFill);
  wrap.appendChild(batt);
  // island / notch sits inside the band — black on black, like the metal
  const cut = document.createElement('div');
  Object.assign(cut.style, phoneSpec.island
    ? { position: 'absolute', left: '50%', top: '11px', transform: 'translateX(-50%)',
        width: '122px', height: '34px', borderRadius: '17px', background: '#000' }
    : { position: 'absolute', left: '50%', top: '0', transform: 'translateX(-50%)',
        width: '172px', height: '28px', borderRadius: '0 0 14px 14px', background: '#000' });
  wrap.appendChild(cut);
  // home indicator in the bottom band
  const homeBar = document.createElement('div');
  Object.assign(homeBar.style, {
    position: 'absolute', left: '50%', bottom: '9px', transform: 'translateX(-50%)',
    width: '110px', height: '4px', borderRadius: '2px', background: 'rgba(255,255,255,0.45)'
  });
  wrap.appendChild(homeBar);
  cssObj = new CSS3DObject(wrap);
  cssScene.add(cssObj);
}

// localhost-ish hosts get http://, real websites get https:// —
// most public sites won't load over plain http
function normalizeURL(u) {
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) {
    const isLocal = /^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.)/i.test(u);
    u = (isLocal ? 'http://' : 'https://') + u;
  }
  return u;
}
urlInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  setLiveURL(normalizeURL(urlInput.value.trim()));
});
interactBtn.onclick = () => {
  interacting = !interacting;
  cv.style.pointerEvents = interacting ? 'none' : 'auto';
  interactBtn.textContent = interacting ? 'Orbit mode' : 'Interact';
};
proxyBtn.onclick = () => {
  proxyTouched = true;
  proxyOn = !proxyOn;
  proxyBtn.textContent = `Proxy: ${proxyOn ? 'on' : 'off'}`;
  if (urlMode) setLiveURL(liveURL);          // reload through/off the proxy
};

// Freeze live page → screenshot on the glass. Uses the server's /shot
// endpoint (a real headless browser → full fidelity, no html2canvas
// limits). Crucially it captures the iframe's CURRENT url — the page you
// navigated to — not the base url, and routes through the proxy so the
// session you built while browsing (incl. logins) is reused.
function currentLiveURL() {
  // in proxy mode the iframe is same-origin, so we can read where it is now
  try {
    const ifr = cssObj && cssObj.element.querySelector('iframe');
    const loc = ifr && ifr.contentWindow && ifr.contentWindow.location.href;
    if (loc && loc !== 'about:blank') {
      const i = loc.indexOf('/proxy?u=');
      return i >= 0 ? decodeURIComponent(loc.slice(i + '/proxy?u='.length)) : loc;
    }
  } catch (e) { /* cross-origin (non-proxy external): fall back */ }
  return liveURL;
}

freezeBtn.onclick = async () => {
  if (!liveURL) return;
  const prev = freezeBtn.textContent;
  freezeBtn.textContent = 'Capturing…';
  try {
    const w = 440;
    const h = Math.round(w * (phoneSpec.h - 0.065) / (phoneSpec.w - 0.065));
    const current = currentLiveURL();
    // route through the proxy when it's on, so the shot's headless browser
    // hits our proxy (which holds the shared session/cookies) → same page
    const target = proxyOn
      ? location.origin + '/proxy?u=' + encodeURIComponent(current)
      : current;
    const r = await fetch(`/shot?u=${encodeURIComponent(target)}&w=${w}&h=${h}`);
    if (!r.ok) throw new Error('server screenshot ' + r.status);
    const blob = await r.blob();
    const img = new Image();
    img.onload = () => {
      setLiveURL('');                 // leave live mode → screen mesh returns
      applyShotImage(img);            // page is now a still on the glass
      urlInput.value = '';
      toast('Captured the current page onto the screen. Save PNG and Record now work. ' +
            'Type a URL again to go back live.');
    };
    img.src = URL.createObjectURL(blob);
  } catch (err) {
    toast('Capture failed: ' + (err && err.message ? err.message : err) +
          '. (Needs the python serve.py running with Edge/Chrome installed.)');
  } finally {
    freezeBtn.textContent = prev;
  }
};

/* ---- custom tagline ---- */
document.getElementById('titleInput').oninput = e => {

/* =====================================================================
   CAPTURE — PNG snapshot + video recording.
   Both render through a composite canvas: the WebGL frame plus the
   cinematic overlays (vignette, logo, tagline, loop fade). The control
   buttons are plain DOM and are NEVER composited, so every capture is
   clean ad footage.
   ===================================================================== */
const capCanvas = document.createElement('canvas');
const capCtx = capCanvas.getContext('2d');
let pendingPNG = false, recorder = null, recChunks = [];

function compositeFrame() {
  const src = renderer.domElement;
  const w = src.width, h = src.height;                  // device pixels
  if (capCanvas.width !== w || capCanvas.height !== h) {
    capCanvas.width = w; capCanvas.height = h;
  }
  const c = capCtx, px = w / innerWidth;                // CSS px → device px
  c.drawImage(src, 0, 0);
  // vignette
  const vg = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45,
                                    w / 2, h / 2, Math.max(w, h) * 0.72);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  c.fillStyle = vg; c.fillRect(0, 0, w, h);
  // logo (matches the DOM overlay's placement and current opacity)
  const lop = parseFloat(logoEl.style.opacity || 0);
  if (logoEl.style.display !== 'none' && lop > 0.01 && logoEl.naturalWidth) {
    const maxH = 72 * px, maxW = innerWidth * 0.4 * px;
    const s = Math.min(maxH / logoEl.naturalHeight, maxW / logoEl.naturalWidth);
    const lw = logoEl.naturalWidth * s, lh = logoEl.naturalHeight * s;
    c.globalAlpha = lop;
    c.drawImage(logoEl, (w - lw) / 2, h - (0.09 * innerHeight + 120) * px - lh, lw, lh);
    c.globalAlpha = 1;
  }
  // tagline + subtitle
  const top = parseFloat(tagEl.style.opacity || 0);
  if (top > 0.01) {
    const fs = parseFloat(getComputedStyle(tagEl).fontSize) * px;
    const baseY = h - 0.09 * innerHeight * px;
    c.globalAlpha = top;
    c.textAlign = 'center';
    c.fillStyle = '#ffffff';
    c.font = `600 ${fs}px ${SANS}`;
    c.fillText(tagEl.childNodes[0].textContent.trim(), w / 2, baseY - fs * 0.85);
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.font = `400 ${fs * 0.38}px ${SANS}`;
    c.letterSpacing = `${fs * 0.12}px`;
    c.fillText(tagEl.querySelector('small').textContent, w / 2, baseY);
    c.letterSpacing = '0px';
    c.globalAlpha = 1;
    c.textAlign = 'left';
  }
  // loop fade
  const fop = parseFloat(fadeEl.style.opacity || 0);
  if (fop > 0.001) { c.fillStyle = `rgba(0,0,0,${fop})`; c.fillRect(0, 0, w, h); }
}

function downloadBlob(blob, name) {
  const a = document.createElement('a');

}

document.getElementById('snapBtn').onclick = () => {

const recBtn = document.getElementById('recBtn');
recBtn.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  compositeFrame();                                     // size before capture
  const mime = ['video/mp4;codecs=avc1', 'video/webm;codecs=h264',
                'video/webm;codecs=vp9', 'video/webm']
    .find(m => MediaRecorder.isTypeSupported(m)) || '';
  recorder = new MediaRecorder(capCanvas.captureStream(60),
    { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
    downloadBlob(new Blob(recChunks, { type: mime || 'video/webm' }), `iphone-ad.${ext}`);
    recorder = null;
    recBtn.textContent = '● Record';
    recBtn.style.color = '';
  };
  recorder.start();
  recBtn.textContent = '■ Stop & save';
  recBtn.style.color = '#ff6b6b';
};
const clock  = new THREE.Clock();
let T = 0;        // ad-timeline clock (accumulated so it can be paused)
let prevReal = 0; // previous wall-clock sample, for frame deltas
let paused = false;

/* ---- Spacebar / click play-pause: freezes the whole scene in place ---- */
const playPauseEl = document.getElementById('playpause');
function setPaused(p) {
  paused = p;
  playPauseEl.innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';  // ▶ when paused, ❚❚ when playing
}
setPaused(false);
playPauseEl.onclick = () => setPaused(!paused);
addEventListener('keydown', e => {
  if (e.code !== 'Space' && e.key !== ' ') return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;  // don't hijack typing
  e.preventDefault();
  setPaused(!paused);
});

/* ---------------------------------------------------------------------
   INTERACTIVE 3D — physically based orbit.
   While dragging, the camera follows the pointer 1:1 and we estimate the
   angular velocity. On release that momentum carries the orbit (a flick
   keeps it spinning) while air friction bleeds it off. After ~2.5s of no
   input an under-damped spring pulls the view back onto the scripted
   cinematic path, settling with a soft sway. Zoom is an inertial dolly:
   the wheel moves a target and a spring chases it.
   --------------------------------------------------------------------- */
const orbit = { az: 0, el: 0, vAz: 0, vEl: 0 };   // user orbit + angular velocity
let zoom = 1, zoomV = 0, zoomTarget = 1;
let dragging = false, lastX = 0, lastY = 0, lastMoveMs = 0, lastInput = -99;
const cv = renderer.domElement;
cv.style.cursor = 'grab';
cv.style.touchAction = 'none';
cv.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  lastMoveMs = performance.now();
  orbit.vAz = orbit.vEl = 0;                      // grabbing absorbs momentum
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = 'grabbing';
  lastInput = T;
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  const dAz = -dx * 0.006, dEl = dy * 0.005;
  orbit.az += dAz;
  orbit.el = clamp(orbit.el + dEl, -1.15, 1.15);
  // low-pass-filtered velocity estimate → momentum on release
  const now = performance.now();
  const dts = Math.max((now - lastMoveMs) / 1000, 1 / 240);
  orbit.vAz = lerp(orbit.vAz, dAz / dts, 0.35);
  orbit.vEl = lerp(orbit.vEl, dEl / dts, 0.35);
  lastMoveMs = now;
  lastX = e.clientX; lastY = e.clientY;
  lastInput = T;
});
const endDrag = () => { dragging = false; cv.style.cursor = 'grab'; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  zoomTarget = clamp(zoomTarget * (1 + e.deltaY * 0.0012), 0.55, 2.2);
  lastInput = T;
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  // Advance an accumulated timeline so pausing simply stops the clock.
  // The rAF loop keeps running while paused (so prevReal stays current and
  // there's no jump on resume); we just hold dt at 0 and freeze T.
  const now = clock.getElapsedTime();
  let dt = Math.min(Math.max(now - prevReal, 0), 0.1);
  prevReal = now;
  if (paused) dt = 0;
  T += dt;
  const t = T % DURATION;                    // 30-second looping ad time

  /* ---- orbit physics (semi-implicit Euler) ---- */
  if (!dragging) {
    if (T - lastInput > 2.5) {
      // spring home: under-damped (ζ≈0.7) so it settles with a soft sway
      const k = 16, c = 5.6;
      orbit.vAz += (-k * orbit.az - c * orbit.vAz) * dt;
      orbit.vEl += (-k * orbit.el - c * orbit.vEl) * dt;
      zoomTarget = 1;
    } else {
      // free spin: momentum from the flick, bled off by air friction
      const f = Math.exp(-dt * 1.4);
      orbit.vAz *= f; orbit.vEl *= f;
    }
    orbit.az += orbit.vAz * dt;
    orbit.el = clamp(orbit.el + orbit.vEl * dt, -1.2, 1.2);
  }
  // inertial dolly: zoom chases its target through a stiff spring
  zoomV += (-18 * (zoom - zoomTarget) - 8.5 * zoomV) * dt;
  zoom += zoomV * dt;

  /* ---- phone transform ---- */
  // weighty rise: fast entry that overshoots ~2% and settles, like real mass
  const rx = clamp(t / 4.6, 0, 10);
  const rise = rx <= 0 ? 0 : 1 - Math.exp(-4 * rx) * Math.cos(2.5 * rx);
  // buoyant idle bob + its velocity (the phone pitches into its motion)
  const bobAmp = sm(4, 6, t);
  const bob    = 0.018 * Math.sin(T * 1.1) * bobAmp;
  const bobVel = 0.018 * 1.1 * Math.cos(T * 1.1) * bobAmp;
  phone.position.y = lerp(-2.1, 0, rise) + bob
                   + 0.17 * springStep((t - 24.5) / 2.2);  // finale lift, spring-settled
  // side-profile tilt: in at 15–19s, back out at 24–27s
  const tilt = sm(15, 19, t) - sm(24, 27, t);
  phone.rotation.y = lerp(-0.55, 0, rise)
                   + 1.30 * tilt
                   + 0.04 * Math.sin(T * 0.5) * (1 - sm(24.5, 26.5, t));
  phone.rotation.x = -0.05 * tilt - 1.2 * bobVel * (1 - tilt);
  phone.rotation.z =  0.015 * Math.sin(T * 0.7) * (1 - sm(24.5, 26.5, t));

  // live URL mode: hold a steady hero pose (the page is being USED) —
  // user orbit/zoom still applies on top
  if (urlMode) {
    phone.position.y = bob * 0.5;
    phone.rotation.set(-0.6 * bobVel, 0.04 * Math.sin(T * 0.4), 0.008 * Math.sin(T * 0.7));
  }

  // dopamine spike when the score lands on screen (~9.5s):
  // the camera punches in slightly and the bloom flares with it
  const hit = sm(9.3, 9.55, t) * (1 - sm(9.55, 10.9, t));

  /* ---- camera path ---- */
  const az = -0.28 + 0.83 * sm(4.5, 15, t) - 0.90 * sm(15.5, 24, t) + 0.35 * sm(24.5, 28, t)
           + 0.005 * Math.sin(T * 0.7);                       // handheld breath
  const el =  0.10 + 0.06 * sm(5, 15, t) - 0.13 * sm(15.5, 24, t) + 0.02 * sm(24.5, 28, t)
           + 0.004 * Math.sin(T * 0.9 + 2);
  let dist = (3.5 - 0.5 * sm(5, 15, t) + 0.3 * sm(15.5, 24, t)) * zoom * (1 - 0.05 * hit);
  let cAz = az + orbit.az;
  let cEl = clamp(el + orbit.el, -1.25, 1.25);
  if (urlMode) {           // steady front camera while the page is live
    cAz = orbit.az + 0.004 * Math.sin(T * 0.5);
    cEl = clamp(0.05 + orbit.el, -1.25, 1.25);
    dist = 3.05 * zoom;
  }
  camera.position.set(
    camTarget.x + dist * Math.sin(cAz) * Math.cos(cEl),
    camTarget.y + dist * Math.sin(cEl),
    camTarget.z + dist * Math.cos(cAz) * Math.cos(cEl)
  );
  camera.lookAt(camTarget);

  /* ---- light sweep across the titanium edge (16–23s) ---- */
  const sa = lerp(-1.5, 1.5, clamp((t - 16) / 7, 0, 1));
  sweepLight.position.set(Math.sin(sa) * 3, 1.3, Math.cos(sa) * 3);
  sweepLight.intensity = 5.0 * sm(16, 17.5, t) * (1 - sm(21.5, 23, t));

  /* ---- atmosphere ---- */
  dust.rotation.y = T * 0.012;
  dust.position.y = Math.sin(T * 0.05) * 0.3;
  glowA.position.x = -2.2 + 0.45 * Math.sin(T * 0.11);
  glowA.position.y =  1.2 + 0.30 * Math.sin(T * 0.07 + 1);
  glowB.position.x =  2.4 + 0.50 * Math.cos(T * 0.09);
  glowB.position.y = -1.4 + 0.35 * Math.cos(T * 0.06 + 3);
  for (const s of streaks) {
    s.position.x += s.userData.speed * dt;
    if (s.position.x > 6) s.position.x = -6;
    s.material.opacity = s.userData.base * (0.6 + 0.4 * Math.sin(T * 0.8 + s.userData.ph));
  }

  /* ---- finale glow + tagline + loop fades ---- */
  const glow = sm(25.5, 27.6, t);
  bloom.strength = 0.55 + 0.35 * glow + 0.5 * hit;
  const cine = urlMode ? 0 : 1;     // overlays rest while a live page is up
  tagEl.style.opacity = sm(27, 28.3, t) * cine;
  tagEl.style.transform = `translateY(${14 * (1 - sm(27, 28.3, t))}px)`;
  logoEl.style.opacity = sm(26.5, 27.8, t) * cine;  // logo leads the tagline
  fadeEl.style.opacity = clamp((1 - sm(0.05, 1.8, t)) + sm(29.1, 29.9, t), 0, 1) * cine;

  /* ---- depth of field: keep focus locked on the phone ---- */
  bokeh.uniforms['focus'].value = camera.position.distanceTo(camTarget);

  drawUI(t, T);
  if (urlMode) {
    // direct render keeps the alpha hole intact; sync the iframe to the
    // screen plane, then draw the CSS3D layer with the same camera
    if (cssObj) {
      const sc = phone.userData.screen;
      sc.getWorldPosition(cssObj.position);
      sc.getWorldQuaternion(cssObj.quaternion);
      cssObj.scale.setScalar((phoneSpec.w - 0.065) / IFRAME_W);
    }
    renderer.render(scene, camera);
    cssRenderer.render(cssScene, camera);
  } else {
    composer.render();
  }

  /* ---- capture hooks: composite immediately after render so the WebGL
         buffer is still valid (no preserveDrawingBuffer needed) ---- */
  if (recorder || pendingPNG) compositeFrame();
  if (pendingPNG) {
    pendingPNG = false;
    capCanvas.toBlob(b => downloadBlob(b, 'iphone-ad.png'), 'image/png');
  }
}
animate();

/* ------------------------------ resize ------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
