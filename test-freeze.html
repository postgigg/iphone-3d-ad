<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>body{margin:0;background:#111;color:#0f0;font-family:monospace}
iframe{width:390px;height:844px;border:0}#out{padding:8px;font-size:14px}
#c{border:2px solid #0f0;width:195px}</style>
</head><body>
<div id="out">loading…</div>
<iframe id="f" src="/proxy?u=https%3A%2F%2Fputtscores.com"></iframe>
<img id="c">
<script>
function oklabToRgb(L,a,b,alpha){
  const l_=L+0.3963377774*a+0.2158037573*b, m_=L-0.1055613458*a-0.0638541728*b, s_=L-0.0894841775*a-1.2914855480*b;
  const l=l_**3,m=m_**3,s=s_**3;
  const R=4.0767416621*l-3.3077115913*m+0.2309699292*s, G=-1.2684380046*l+2.6097574011*m-0.3413193965*s, B=-0.0041960863*l-0.7034186147*m+1.7076147010*s;
  const f=x=>{x=x<=0.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-0.055;return Math.round(Math.min(1,Math.max(0,x))*255);};
  const rgb=`${f(R)}, ${f(G)}, ${f(B)}`; return alpha!=null&&alpha<1?`rgba(${rgb}, ${alpha})`:`rgb(${rgb})`;
}
function num(t){t=t.trim();return t.endsWith('%')?parseFloat(t)/100:parseFloat(t);}
function convOneColor(token){
  const isLch=/^oklch/i.test(token); let inner=token.slice(token.indexOf('(')+1,token.lastIndexOf(')')); let alpha=null;
  if(inner.includes('/')){const p=inner.split('/');inner=p[0];alpha=num(p[1]);}
  const p=inner.trim().split(/[\s,]+/).filter(Boolean); const L=num(p[0]);
  if(isLch){const C=(p[1]||'').endsWith('%')?parseFloat(p[1])/100*0.4:parseFloat(p[1])||0;let H=parseFloat(p[2])||0;if((p[2]||'').includes('rad'))H=H*180/Math.PI;const hr=H*Math.PI/180;return oklabToRgb(L,C*Math.cos(hr),C*Math.sin(hr),alpha);}
  return oklabToRgb(L,parseFloat(p[1])||0,parseFloat(p[2])||0,alpha);
}
const convOklch=str=>str.replace(/okl(?:ch|ab)\([^)]*\)/gi,m=>{try{return convOneColor(m);}catch(e){return 'rgb(128,128,128)';}});
function sanitizeOklch(clonedDoc,srcDoc){
  let css='';const sheets=(srcDoc||clonedDoc).styleSheets;
  for(const sheet of sheets){let rules;try{rules=sheet.cssRules;}catch(e){continue;}if(!rules)continue;for(const rule of rules){if(rule.cssText)css+=rule.cssText+'\n';}}
  if(css.indexOf('okl')!==-1)css=convOklch(css);
  clonedDoc.querySelectorAll('style, link[rel="stylesheet"]').forEach(n=>n.remove());
  const s=clonedDoc.createElement('style');s.textContent=css;(clonedDoc.head||clonedDoc.documentElement).appendChild(s);
  clonedDoc.querySelectorAll('[style]').forEach(el=>{const st=el.getAttribute('style');if(st&&st.indexOf('okl')!==-1)el.setAttribute('style',convOklch(st));});
}

const out=document.getElementById('out'), f=document.getElementById('f');
f.onload=()=>setTimeout(async()=>{
  try{
    const doc=f.contentDocument;
    if(!doc){out.textContent='RESULT: cross-origin';window.__r='cross-origin';return;}
    const shot=await html2canvas(doc.documentElement,{width:f.clientWidth,height:f.clientHeight,windowWidth:f.clientWidth,windowHeight:f.clientHeight,scale:1,useCORS:true,backgroundColor:'#ffffff',onclone:(cd)=>sanitizeOklch(cd,doc)});
    const ctx=shot.getContext('2d'); const d=ctx.getImageData(0,0,shot.width,shot.height).data;
    let nonWhite=0; for(let i=0;i<d.length;i+=400){if(d[i]<240||d[i+1]<240||d[i+2]<240)nonWhite++;}
    document.getElementById('c').src=shot.toDataURL('image/png');
    out.textContent=`RESULT: ok ${shot.width}x${shot.height}, nonWhite=${nonWhite}`; window.__r=`ok ${shot.width}x${shot.height} nonWhite=${nonWhite}`;
  }catch(e){out.textContent='RESULT: error '+e.message;window.__r='error '+e.message;}
},3500);
</script>
</body></html>
